<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Google.com</title>
<style>
    html,body{
        margin: 0;
        height: 100% ;
        color:#1f1f1f;
        font-family: Arial, sans-serif;
        font-size: 13px;
    }
     
    .search-box{
        align-items: center;
        justify-content: center;
    }
    
     .search-bar {
       width: 487px;
        height: 50px;
        padding-left: 10px;
        border-radius: 200px;
        border-color: transparent;
        background-color: white;
        color: #000;
        border: none;
        outline: none;
        box-shadow: 0 1px 6px rgba(32, 33, 36, 0.28);
        cursor: pointer;
        position: absolute;
        display: flex;
        align-items: center;
     }

   
    
    

    .google {
        width: 272px;
        height: 92px;
        display: flex;
        justify-content: center;
        align-items: center; 
        top: 50%;
        left: 50%;
        translate: -50% -50%;
        position: absolute;

    }
   

    
    

    
    
    .gene{
        position: absolute;
        top: 15px;
        right: 20px;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }

    .gene:hover{
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .profile-pics{
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .buttons{
        display: flex;
        justify-content: center;
        margin-top: 30px;
        
    }
    .google-find{
        width: 120px;
        height: 40px;
        margin: 0 10px;
        border-radius: 5px; 
       border: none;
        background-color: #f8f9fa;
        box-shadow: 0 1px 1px rgba(0, 0, 0, .1);
        font-size: 14px;
        cursor: pointer;
    }
    .google-find:hover{
        background-color: #f8f9fa;
        box-shadow: 0 1px 1px rgba(0, 0, 0, .1);
        color:#202124;
        border: 1px solid #dadce0;
        
    
    }
    .google-lucky{
        width: 150px;
        height: 40px;
        margin: 0 10px;
        border-radius: 5px;
        border: none;
        background-color: #f8f9fa;
        color: #000;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 1px 1px rgba(0, 0, 0, .1);
        font-family: Arial,sans-serif;
        font-weight: 500;


        
    }
    .google-lucky:hover{
        background-color: #f8f9fa;
        box-shadow: 0 1px 1px rgba(0, 0, 0, .1);
        color:#202124;
        border: 1px solid #dadce0;
    }

    .app-icons{
        position: absolute;
        top: 22px;
        right: 78px;
        cursor: pointer;
        
        

    }
    .Images{
        position: absolute;
        top: 26px;
        right: 130px;
        cursor: pointer;
    }

    .gmail{
        position: absolute;
        top: 26px;
        right: 190px;
        cursor: pointer;
    }

    .search-icon {
        position: absolute;
        top: 50%;
        left: -480px;
        transform: translateY(50%);
        font-size: 18px;
        color: #5f6368;
    }

    .camera-icon {
        position: absolute;
        top: 50%;
        right: 50px;
        transform: translateY(-50%);
        font-size: 18px;
        color: #5f6368;


    }
    .naija{
        padding: 15px 30px;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        top: 50px;



    }

   


    

        
    


</style>

</head>
<body> 
    <nav>
    <div class="gene">

        <img src="gene.jpeg" alt="profile picture" class="profile-pics">
    </div>
    <div class="app-icons">
        <svg xmlns="http://www.w3.org/2000/svg"width="24" height="24" viewBox="0 0 24 24" fill="#5f6368">
            <circle cx="4" cy="4" r="2"></circle>
            <circle cx="12" cy="4" r="2"></circle>
            <circle cx="20" cy="4" r="2"></circle>
            <circle cx="4" cy="12" r="2"></circle>
            <circle cx="12" cy="12" r="2"></circle>
            <circle cx="20" cy="12" r="2"></circle>
            <circle cx="4" cy="20" r="2"></circle>
            <circle cx="12" cy="20" r="2"></circle>
            <circle cx="20" cy="20" r="2"></circle>
        </svg>
    </div>
    
        <div class="Images">
            Images
    </div> 
    <div class="gmail">
        Gmail
    </div> </nav>

   

    <div class="google">
        <img src="google_logo copy.svg" class="gg">
    </div>
        
        
      
       <div>
        <div class="search-box">
            <input type="text" class="search-bar"  placeholder=" ">
            <span class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></span>
            <span class="camera-icon"><i class="fa-solid fa-camera"></i></span>
        </div>
       </div>
        
    
      
    


    <div class="buttons">
    <button class="google-find">Google Find</button>
    <button class="google-lucky">I Dey Feel Lucky</button>
    </div>

    <div class="naija">Naijíria</div>
    
</body>


</html>
